name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/beautiful-davinci-dLJtD
  workflow_dispatch:

# Least privilege: this job only reads the repository. (It was missing, so the token took the repository default.)
permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Create .env from example
        working-directory: mobile
        run: cp .env.example .env

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        env:
          # Passed through the environment rather than interpolated into the script text.
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://arsocietyapp-production.up.railway.app/api/v1' }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV=production

      - name: Rename APK
        working-directory: mobile
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/DUXOS Society.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DUXOS Society
          path: mobile/build/app/outputs/flutter-apk/DUXOS Society.apk
          retention-days: 14
