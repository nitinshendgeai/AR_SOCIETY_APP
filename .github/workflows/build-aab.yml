name: Build Android App Bundle (Play Store)

# Manual: Actions -> "Build Android App Bundle (Play Store)" -> Run workflow.
# Needs the upload-key secrets described in docs/ANDROID_RELEASE.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release AAB (in.duxos.society)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          # Pinned: Flutter 3.50 needs Gradle 9.3.1+, this project is on 8.14.3, so an unpinned `stable` broke the
          # Android build on 12 Nov. 3.47.9 is the version that last built it. Raise it together with the Gradle upgrade.
          # (flutter-ci.yml analyzes and tests on 3.47.5, the same 3.47 line.)
          flutter-version: '3.47.9'
          cache: true

      - name: Create .env from example
        working-directory: mobile
        run: cp .env.example .env

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set - see docs/ANDROID_RELEASE.md"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      # The version code must go up on every upload to Play, so it comes from the run number.
      # The version name still comes from `version:` in mobile/pubspec.yaml.
      - name: Build release AAB
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://arsocietyapp-production.up.railway.app/api/v1' }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV=production \
            --dart-define=APP_EDITION=field

      # Fails the job unless the bundle is signed, the signature is valid, and the signing certificate is the one in
      # the configured upload keystore (a debug-signed or wrongly-signed bundle would pass `jarsigner -verify` alone,
      # so the fingerprint comparison is the real check). Prints only public certificate fingerprints; passwords are
      # read by keytool from environment variables and never appear on a command line or in the log.
      - name: Verify AAB signature
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          AAB=mobile/build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB" || { echo "::error::AAB not found at $AAB"; exit 1; }

          # 1. Signed, and the signature is valid.
          VERIFY_OUT="$(jarsigner -verify "$AAB" 2>&1 || true)"
          if echo "$VERIFY_OUT" | grep -qi "jar is unsigned"; then
            echo "::error::The AAB is unsigned."; exit 1
          fi
          if ! echo "$VERIFY_OUT" | grep -q "^jar verified"; then
            echo "::error::jarsigner could not verify the AAB signature."
            echo "$VERIFY_OUT" | head -20; exit 1
          fi
          echo "jarsigner: jar verified"

          # 2. SHA-256 of the certificate that signed the AAB.
          AAB_SHA="$(keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d '[:space:]')"

          # 3. SHA-256 of the configured upload keystore's certificate.
          KS_SHA="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d '[:space:]')"

          [ -n "$AAB_SHA" ] || { echo "::error::Could not read the signing certificate from the AAB."; exit 1; }
          [ -n "$KS_SHA" ] || { echo "::error::Could not read the upload certificate from the keystore (wrong alias or password?)."; exit 1; }

          echo "AAB signing certificate SHA-256:     $AAB_SHA"
          echo "Upload keystore certificate SHA-256: $KS_SHA"
          if [ "$AAB_SHA" != "$KS_SHA" ]; then
            echo "::error::AAB is not signed with the configured upload key (fingerprints differ)."; exit 1
          fi
          echo "Fingerprints match: the AAB is signed with the upload key."
          {
            echo "### AAB signature verified"
            echo "- Certificate SHA-256: \`$AAB_SHA\`"
            echo "- Register this as the upload key fingerprint in Play Console if asked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DUXOS Society AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
