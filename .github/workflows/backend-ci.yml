name: Backend CI

# Runs on every pull request and on every push to main. There is deliberately NO paths filter: these checks are
# meant to be "required", and a required check that is skipped by a filter blocks (or silently passes) unrelated PRs.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: these jobs only read the repository. Nothing here deploys or writes.
permissions:
  contents: read

# A newer push to the same pull request replaces the older run; runs on main always finish.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Production runs Python 3.12 (backend/runtime.txt = python-3.12.3, nixpacks python312), so the tests do too.
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only values. The suite builds its own throw-away SQLite file; no production database, host or secret is
      # reachable from here, and none is passed in.
      DATABASE_URL: sqlite:///./test_ar_society.db
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
      APP_ENV: test
      SCHEDULER_ENABLED: "false"
    steps:
      - name: Check out the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The dev lock is the hash-pinned pip-compile output of requirements-dev.in (production lock + test tools).
      # --require-hashes makes any drift from the lock a hard failure.
      - name: Install dependencies (hash-enforced)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Python syntax and import check
        run: |
          python -m compileall -q app tests scripts
          python -c "from app.main import app; print('app imports,', len(app.routes), 'routes')"

      # The Phase 1 authentication / tenant-isolation / RBAC / readiness regression tests, run first and on their own
      # so a security regression is the first thing a reviewer sees. They run again inside the full suite below.
      - name: Security regression tests (authentication, tenant isolation, RBAC, readiness)
        run: |
          python -m pytest tests/security -ra -q -o log_cli=false -p no:cacheprovider \
            --junitxml=test-results/security.xml
        # no continue-on-error: a failure here fails the job

      - name: Check the security test report
        if: ${{ !cancelled() }}
        run: python scripts/ci/check_test_results.py test-results/security.xml --min-tests 50 --title "Security regression tests"

      - name: Full backend test suite
        run: |
          python -m pytest -ra -q -o log_cli=false -p no:cacheprovider \
            --junitxml=test-results/backend.xml

      # pytest's exit code is the primary gate. This second check refuses a "green" run that is empty, truncated, or
      # missing the security package (see scripts/ci/check_test_results.py).
      - name: Check the full-suite report
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci/check_test_results.py test-results/backend.xml \
            --min-tests 1200 --max-skipped 5 --require-package tests.security=50 --title "Backend test suite"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports
          path: backend/test-results/
          retention-days: 14
          if-no-files-found: error

  migrations:
    name: Migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # A disposable database used only by this job. The credentials exist only inside this job's network.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DB_URL: postgresql://ci:ci-throwaway-password@localhost:5432/postgres
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
      APP_ENV: test
      SCHEDULER_ENABLED: "false"
    steps:
      - name: Check out the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (hash-enforced)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Migration history is one unbroken chain with one head
        run: python scripts/ci/check_migrations.py graph

      # Empty database -> head, structural drift, last migration reversible, earlier revision -> head, and the app's
      # /health/ready answering 200 at head and 503 one revision behind. See scripts/ci/check_migrations.py.
      - name: Fresh and upgrade migrations on PostgreSQL, readiness
        run: python scripts/ci/check_migrations.py full --admin-url "$ADMIN_DB_URL"

      # Proves the checks above can fail: a broken history, a missing column, a false-green test report.
      - name: CI script self-tests (including the schema-drift negative case)
        env:
          MIGRATION_TEST_ADMIN_URL: ${{ env.ADMIN_DB_URL }}
        run: |
          python -m pytest tests/ci -ra -q -o log_cli=false -p no:cacheprovider --junitxml=test-results/ci-scripts.xml
          python scripts/ci/check_test_results.py test-results/ci-scripts.xml --min-tests 15 --max-skipped 0 \
            --title "CI script self-tests"
