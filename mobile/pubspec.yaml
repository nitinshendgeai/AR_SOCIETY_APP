name: ar_society_app
description: DUX OS - Society ERP Mobile Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP Client
  dio: ^5.7.0

  # Secure Storage (JWT persistence)
  flutter_secure_storage: ^9.2.2

  # Biometric unlock (fingerprint / face)
  local_auth: ^2.3.0

  # Local Storage
  shared_preferences: ^2.3.2

  # Environment Config
  flutter_dotenv: ^5.2.1

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.4.0

  # Resident bulk import (CSV template download / file picking / parsing)
  csv: ^6.0.0
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/
    - .env
    - .env.production

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
