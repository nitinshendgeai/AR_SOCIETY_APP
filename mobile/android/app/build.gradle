plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing. Reads android/key.properties (local builds) or the ANDROID_KEYSTORE_* environment
// variables (CI).
//  - Play Store bundles (`bundleRelease`) REQUIRE a valid upload key: the build fails immediately if the
//    keystore, passwords or alias are missing or the keystore file does not exist. There is no debug-key fallback.
//  - APK builds (`assembleRelease`, `assembleDebug`) are for development/testing and keep working without a
//    key: a release APK is then debug-signed and must never be uploaded to Play.
// See docs/ANDROID_RELEASE.md.
def keyProps = new Properties()
def keyPropsFile = rootProject.file("key.properties")
if (keyPropsFile.exists()) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}
def signingValue = { String prop, String env ->
    def v = keyProps.getProperty(prop) ?: System.getenv(env)
    (v == null || v.trim().isEmpty()) ? null : v
}
def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_FILE")
def releaseStorePassword = signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
def hasReleaseKey = releaseStoreFile != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null &&
        file(releaseStoreFile).isFile()

// Fail before any compilation starts when a bundle is requested without a usable key.
gradle.taskGraph.whenReady { graph ->
    def bundling = graph.allTasks.any { it.name ==~ /bundle.*Release/ }
    if (bundling && !hasReleaseKey) {
        def missing = []
        if (releaseStoreFile == null) missing << "storeFile / ANDROID_KEYSTORE_FILE"
        else if (!file(releaseStoreFile).isFile()) missing << "keystore file not found at the configured path"
        if (releaseStorePassword == null) missing << "storePassword / ANDROID_KEYSTORE_PASSWORD"
        if (releaseKeyAlias == null) missing << "keyAlias / ANDROID_KEY_ALIAS"
        if (releaseKeyPassword == null) missing << "keyPassword / ANDROID_KEY_PASSWORD"
        throw new GradleException("Release signing is not configured, refusing to build a Play Store bundle " +
                "with the debug key. Problem(s): " + missing.join("; ") + ". See docs/ANDROID_RELEASE.md.")
    }
}

android {
    namespace "in.duxos.society"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "in.duxos.society"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            // R8 minification was enabled with no proguard-rules.pro and no
            // default Flutter/Android keep rules — R8 could freely rename or
            // strip Java/Kotlin classes that native plugin code (sqflite,
            // flutter_secure_storage) looks up by hardcoded name via JNI,
            // causing a native crash on startup on real devices even though
            // debug builds (which skip R8) work fine. Disabled until proper
            // keep rules are authored and verified against a real device.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
